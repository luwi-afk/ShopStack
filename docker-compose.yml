services:
  postgres:
    image: postgres:17
    container_name: shopstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopstack
      POSTGRES_USER: shopstack
      POSTGRES_PASSWORD: shopstack_dev_password
    ports:
      - "5432:5432"
    volumes:
      - shopstack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopstack -d shopstack"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  shopstack_postgres_data:
